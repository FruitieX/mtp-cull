name: Windows packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:REF_TYPE -eq 'tag' -and $env:RELEASE_TAG -ne "v$version") {
            throw 'Tag must match the version in Cargo.toml.'
          }
      - name: Install build tools
        run: |
          choco install nasm innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Build tool installation failed.' }
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
          cargo install cargo-bundle-licenses --version 4.2.0 --locked
          if ($LASTEXITCODE -ne 0) { throw 'License bundler installation failed.' }
      - name: Format, test and package
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          ./scripts/package-windows.ps1 -Test
      - name: Check package metadata, icons and CLI
        run: ./scripts/verify-windows-package.ps1
      - name: Check isolated install, upgrade and uninstall
        run: ./scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-packages
          path: target/dist/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-packages
          path: packages
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "Refusing to replace assets of an already published release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" packages/* --clobber
          else
            gh release create "$RELEASE_TAG" packages/* --draft --verify-tag --title "mtp-cull $RELEASE_TAG" --notes "Windows x64 installer and portable ZIP. The installer includes Start-menu and optional desktop shortcuts. User presets, review choices and cached photos are preserved during upgrades and uninstall."
          fi
