[package]
name = "mtp-cull"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
eframe = "0.35.0"
egui_extras = { version = "0.35.0", features = [
    "image",
    "file",
] }
env_logger = "0.11.11"
humantime = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
log = "0.4.33"
rfd = "0.17.2"
size = "0.5.0"
tempfile = "3.23.0"
url = "2.5.7"

[target.'cfg(windows)'.dependencies]
winmtp = "0.3.2"
